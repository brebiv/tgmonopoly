version: '3'

services:
  redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
  app:
    build:
      context: .
      target: runtime
    env_file: .env.production
    depends_on:
      - redis
    ports:
      - "8000:8000"

